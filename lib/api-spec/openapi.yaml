openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FixFinder local vehicle service marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: providers
    description: Public and authenticated provider operations
  - name: categories
    description: Marketplace categories
  - name: admin
    description: Protected marketplace administration
  - name: enquiries
    description: Customer contact requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List active service categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: Search verified active providers
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/City"
        - $ref: "#/components/parameters/CategorySlug"
        - name: minRating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: verified
          in: query
          schema:
            type: boolean
        - name: openNow
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
      responses:
        "200":
          description: Provider search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSearchResponse"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Create a provider profile for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Created provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: User already owns a provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /providers/mine:
    get:
      operationId: getMyProvider
      tags: [providers]
      summary: Get the signed-in user's provider profile
      responses:
        "200":
          description: Provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /providers/{providerId}:
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider profile
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          description: Provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
        "404":
          $ref: "#/components/responses/NotFound"
  /providers/{providerId}/edit:
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider profile owned by the signed-in user
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [admin]
      summary: Get marketplace statistics
      responses:
        "200":
          description: Marketplace statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/providers:
    get:
      operationId: listAdminProviders
      tags: [admin]
      summary: List providers for review
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, suspended, all]
            default: all
      responses:
        "200":
          description: Providers for admin review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/categories:
    post:
      operationId: createAdminCategory
      tags: [admin]
      summary: Create a marketplace category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/categories/{categoryId}:
    patch:
      operationId: updateAdminCategory
      tags: [admin]
      summary: Update a marketplace category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/providers/{providerId}/status:
    patch:
      operationId: updateProviderStatus
      tags: [admin]
      summary: Approve, reject, or suspend a provider
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderStatusInput"
      responses:
        "200":
          description: Updated provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Send an enquiry to a provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 80
    City:
      name: city
      in: query
      schema:
        type: string
        maxLength: 60
    CategorySlug:
      name: category
      in: query
      schema:
        type: string
        maxLength: 80
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        providerCount:
          type: integer
      required: [id, name, slug, icon, providerCount]
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string
          minLength: 2
        icon:
          type: string
          minLength: 2
        active:
          type: boolean
      required: [name, slug, icon]
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string
          minLength: 2
        icon:
          type: string
          minLength: 2
        active:
          type: boolean
    ProviderService:
      type: object
      properties:
        name:
          type: string
        priceFrom:
          type: ["number", "null"]
      required: [name, priceFrom]
    WorkingHour:
      type: object
      properties:
        day:
          type: string
        open:
          type: string
        close:
          type: string
        closed:
          type: boolean
      required: [day, open, close, closed]
    Review:
      type: object
      properties:
        id:
          type: integer
        author:
          type: string
        rating:
          type: number
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, author, rating, body, createdAt]
    ProviderProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        shopName:
          type: string
        slug:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ProviderService"
        experienceYears:
          type: integer
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        description:
          type: string
        profilePhoto:
          type: string
          format: uri
        shopPhotos:
          type: array
          items:
            type: string
            format: uri
        rating:
          type: number
        reviewCount:
          type: integer
        distanceKm:
          type: ["number", "null"]
        availability:
          type: string
          enum: [available, busy, closed]
        verified:
          type: boolean
        status:
          type: string
          enum: [pending, approved, rejected, suspended]
        workingHours:
          type: array
          items:
            $ref: "#/components/schemas/WorkingHour"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        coordinates:
          $ref: "#/components/schemas/Coordinates"
      required:
        - id
        - name
        - shopName
        - slug
        - category
        - services
        - experienceYears
        - phone
        - address
        - city
        - description
        - profilePhoto
        - shopPhotos
        - rating
        - reviewCount
        - distanceKm
        - availability
        - verified
        - status
        - workingHours
        - reviews
        - coordinates
    Coordinates:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required: [lat, lng]
    ProviderSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProviderProfile"
        total:
          type: integer
        cities:
          type: array
          items:
            type: string
      required: [items, total, cities]
    ProviderInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        shopName:
          type: string
          minLength: 2
        categorySlug:
          type: string
        serviceNames:
          type: array
          minItems: 1
          items:
            type: string
        experienceYears:
          type: integer
          minimum: 0
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        description:
          type: string
        profilePhoto:
          type: string
        shopPhotos:
          type: array
          items:
            type: string
        availability:
          type: string
          enum: [available, busy, closed]
        workingHours:
          type: array
          items:
            $ref: "#/components/schemas/WorkingHour"
      required:
        - name
        - shopName
        - categorySlug
        - serviceNames
        - experienceYears
        - phone
        - address
        - city
        - description
        - profilePhoto
        - shopPhotos
        - availability
        - workingHours
    ProviderUpdate:
      allOf:
        - $ref: "#/components/schemas/ProviderInput"
    ProviderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected, suspended, pending]
      required: [status]
    AdminProvider:
      allOf:
        - $ref: "#/components/schemas/ProviderProfile"
        - type: object
          properties:
            ownerEmail:
              type: string
            submittedAt:
              type: string
              format: date-time
          required: [ownerEmail, submittedAt]
    DashboardStats:
      type: object
      properties:
        totalProviders:
          type: integer
        verifiedProviders:
          type: integer
        pendingProviders:
          type: integer
        citiesCovered:
          type: integer
        totalReviews:
          type: integer
      required: [totalProviders, verifiedProviders, pendingProviders, citiesCovered, totalReviews]
    EnquiryInput:
      type: object
      properties:
        providerId:
          type: integer
        name:
          type: string
          minLength: 2
        phone:
          type: string
        message:
          type: string
          minLength: 5
      required: [providerId, name, phone, message]
    Enquiry:
      allOf:
        - $ref: "#/components/schemas/EnquiryInput"
        - type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time
          required: [id, createdAt]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

